# ============================================================================
# MOBOLULU — build the mobile showcase on EAS and refresh the QR on Pages.
#
# Triggers on pushes that touch the mobile design system (not the web gallery):
#   - apps/mobile-showcase/**
#   - packages/mobile/**
#   - packages/tokens/**
#   - this workflow file
#
# Flow: install deps (GHCR via GITHUB_TOKEN) -> `eas build` (preview APK) ->
# wait for completion -> dispatch the Pages deploy, passing the build URL as
# the expo_url input. The Pages build embeds it as VITE_EXPO_URL so the Mobile
# page renders a scannable QR. (We dispatch Pages directly instead of writing a
# repo variable, because the workflow token can't manage repo variables here.)
# ============================================================================
name: eas-mobile-build

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile-showcase/**'
      - 'packages/mobile/**'
      - 'packages/tokens/**'
      - '.github/workflows/eas-build.yml'
  workflow_dispatch:

# MBLL-169: defensive alignment with the event-aware key used fleet-wide —
# this workflow has no pull_request trigger today, so
# github.event.pull_request.number is always empty and behavior here is
# unchanged; it just means a pull_request trigger added later (the path
# test.yml took under MBLL-152) can't silently reopen the push-vs-closed
# race.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  build:
    # Pinned (MBLL-60): ubuntu-latest flips to Ubuntu 26 on 2026-10-19
    # (actions/runner-images#14748) — pin the exact image, migrate deliberately.
    runs-on: ubuntu-24.04
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@mobolulu"

      - name: Install mobile showcase deps
        working-directory: apps/mobile-showcase
        run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # MBLL-60: EXPO_TOKEN died silently once already (revoked server-side
      # between 2026-08-21 and 2026-09-27; every run since fails at the first
      # EAS call). Without this gate the failure is a bare "GraphQL request
      # failed." plus a python traceback — nothing points at the token.
      - name: Preflight - EXPO_TOKEN must authenticate
        working-directory: apps/mobile-showcase
        run: |
          set +e
          out=$(npx eas whoami 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "$out"
            echo "::error::EXPO_TOKEN was rejected by Expo (see eas whoami output above). Rotate it: mint a fresh access token in the airwaste Expo account and run: gh secret set EXPO_TOKEN -R mobolulu/design-system"
            exit 1
          fi
          echo "EAS authenticated as: $(echo "$out" | tail -n1)"

      - name: Trigger EAS preview build
        id: eas
        working-directory: apps/mobile-showcase
        run: |
          # MBLL-83: capture and check before parsing — piped straight into
          # `python3 -c json.load`, an eas failure surfaces as a Python
          # traceback that buries the actual error. stderr flows to the job
          # log uncaptured; only the JSON on stdout goes into $out.
          set +e
          out=$(npx eas build --platform android --profile preview \
            --non-interactive --no-wait --json)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::eas build exited $rc before queueing a build — see the eas output above."
            exit 1
          fi
          if [ -z "$out" ]; then
            echo "::error::eas build exited 0 but printed no JSON to stdout."
            exit 1
          fi
          set +e
          BUILD_ID=$(printf '%s' "$out" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['id'])")
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || [ -z "$BUILD_ID" ]; then
            echo "$out"
            echo "::error::could not read a build id from the eas build JSON (raw output above)."
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for build to finish
        id: wait
        working-directory: apps/mobile-showcase
        run: |
          BUILD_ID="${{ steps.eas.outputs.build_id }}"
          STATUS=""
          for i in $(seq 1 60); do
            # MBLL-83: same guard as the trigger step — check before parsing.
            set +e
            out=$(npx eas build:view "$BUILD_ID" --json)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] || [ -z "$out" ]; then
              echo "$out"
              echo "::error::eas build:view failed (exit $rc) while polling build $BUILD_ID — see output above if any."
              exit 1
            fi
            set +e
            STATUS=$(printf '%s' "$out" \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['status'])")
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] || [ -z "$STATUS" ]; then
              echo "$out"
              echo "::error::could not read the status from the eas build:view JSON for build $BUILD_ID (raw output above)."
              exit 1
            fi
            if [ "$STATUS" = "FINISHED" ] || [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              break
            fi
            sleep 15
          done
          if [ -z "$STATUS" ]; then
            echo "::error::build $BUILD_ID did not reach a terminal status within 15 minutes of polling."
            exit 1
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Deploy Pages with new QR URL
        if: steps.wait.outputs.status == 'FINISHED'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_ID="${{ steps.eas.outputs.build_id }}"
          URL="https://expo.dev/accounts/airwaste/projects/airwaste-design-system-mobile/builds/$BUILD_ID"
          gh workflow run deploy-pages --repo "$GITHUB_REPOSITORY" \
            --field expo_url="$URL"
