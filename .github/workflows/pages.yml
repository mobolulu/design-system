# ============================================================================
# MOBOLULU — deploy the component showcase to GitHub Pages.
#
# Builds apps/showcase (Vite + React + Tailwind, consuming the published
# @mobolulu/design-system-web from GHCR) and publishes dist/ to Pages.
# ============================================================================
name: deploy-pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/showcase/**'
      - 'packages/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      expo_url:
        description: "Expo preview build URL to embed as the mobile QR (overrides EXPO_PREVIEW_URL var)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@mobolulu"

      - name: Install showcase deps
        working-directory: apps/showcase
        run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build showcase
        working-directory: apps/showcase
        run: npm run build
        env:
          # Prefer the URL passed from the EAS build workflow (workflow_dispatch
          # input); fall back to the EXPO_PREVIEW_URL repo variable. When set,
          # the Mobile page renders a scannable QR pointing at the Expo build.
          VITE_EXPO_URL: ${{ github.event.inputs.expo_url || vars.EXPO_PREVIEW_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/showcase/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
