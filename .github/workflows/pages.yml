# =============================================================================================================================
# MOBOLULU — deploy the component showcase to GitHub Pages.
#
# Builds apps/showcase (Vite + React + Tailwind) and publishes dist/ to Pages.
#
# apps/showcase is a root npm workspace (MBLL-159): it resolves
# @mobolulu/design-system-web from packages/web in this checkout, not from
# the registry, so an unreleased component is demoable/buildable the moment
# it merges — no gap where the showcase can only build against whatever was
# last published. That's also why packages/web has to be built before the
# showcase step: npm workspaces link siblings by name, they don't build them.
# ==========================================================================================================================
name: deploy-pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/showcase/**'
      - 'packages/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      expo_url:
        description: "Expo preview build URL to embed as the mobile QR (overrides EXPO_PREVIEW_URL var)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned (MBLL-60): ubuntu-latest flips to Ubuntu 26 on 2026-10-19
    # (actions/runner-images#14748) — pin the exact image, migrate deliberately.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build design-system-web
        run: npm run build --workspace=packages/web

      - name: Build showcase
        run: npm run build --workspace=apps/showcase
        env:
          # Prefer the URL passed from the EAS build workflow (workflow_dispatch
          # input); fall back to the EXPO_PREVIEW_URL repo variable. When set,
          # the Mobile page renders a scannable QR pointing at the Expo build.
          VITE_EXPO_URL: ${{ github.event.inputs.expo_url || vars.EXPO_PREVIEW_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/showcase/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
