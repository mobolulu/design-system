# MOBOLULU — lint/type-check/test gate for the design system (MBLL-38).
# Runs on every PR and on pushes to master. Publishing stays tag-driven
# (publish.yml).
name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned (MBLL-60): ubuntu-latest flips to Ubuntu 26 on 2026-10-19
    # (actions/runner-images#14748) — pin the exact image, migrate deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build --workspaces --if-present

      - name: Type-check
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present
