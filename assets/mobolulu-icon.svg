  <!-- Recycle symbol (white, modern rounded arrows) -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arrow tails -->
    <path d="M 275 262.9 L 305 314.9" fill="none"/>
    <path d="M 280.4 338 L 220.4 338" fill="none"/>
    <path d="M 212.6 305.1 L 242.6 253.1" fill="none"/>

