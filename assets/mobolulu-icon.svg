<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MOBOLULU icon">
  <defs>
    <linearGradient id="bodyGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="45%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- Soft ground shadow -->
  <ellipse cx="256" cy="436" rx="112" ry="12" fill="#15803D" opacity="0.18"/>

  <!-- Lid handle -->
  <rect x="232" y="84" width="48" height="16" rx="8" fill="#4ADE80"/>

  <!-- Lid -->
  <rect x="146" y="100" width="220" height="34" rx="16" fill="#15803D"/>

  <!-- Bin body (rounded, tapered) -->
  <path fill="url(#bodyGreen)" d="
